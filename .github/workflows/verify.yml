name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # scripts/verify.mjs imports the per-file client modules tsc generates
      # under lib/client/; they are gitignored because the shipped client is the
      # bundled lib/client.js. Compile just that side instead of rebuilding the
      # bundle: CSS-module hashes embed the absolute checkout path, so a Linux
      # rebuild cannot match the committed artifact stamp. tsc output is
      # deterministic and lib/client/ is excluded from the stamp.
      - run: pnpm exec tsc -p tsconfig.client.json
      - run: pnpm typecheck
      - run: pnpm verify
      - run: pnpm verify:release-guard
